<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48 64x64" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logo192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/logo512.png" />

    <!-- Preconnect to font services and load fonts non-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Full-stack developer portfolio showcasing modern web applications and innovative solutions"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="author" content="Parthiv Rawat" />
    <title>Portfolio | Full-Stack Developer</title>

    <!-- Open Graph -->
    <meta property="og:title" content="Portfolio | Full-Stack Developer" />
    <meta
      property="og:description"
      content="Full-stack developer portfolio showcasing modern web applications and innovative solutions"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Parthiv Rawat Portfolio" />
    <meta property="og:site_name" content="Portfolio" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Portfolio | Full-Stack Developer" />
    <meta
      name="twitter:description"
      content="Full-stack developer portfolio showcasing modern web applications and innovative solutions"
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta name="twitter:image:alt" content="Parthiv Rawat Portfolio" />

    <!-- Canonical -->
    <link rel="canonical" href="%VITE_SITE_URL%" />

    <!-- JSON-LD Person schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Parthiv Rawat",
        "url": "%VITE_SITE_URL%",
        "image": "%VITE_SITE_URL%/og-image.jpg",
        "jobTitle": "Full-Stack Developer",
        "description": "Full-stack developer portfolio showcasing modern web applications and innovative solutions",
        "sameAs": [
          "https://github.com/parthivrawat",
          "https://www.linkedin.com/in/parthiv-rawat"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
