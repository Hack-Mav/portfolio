<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="frontendGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="backendGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" rx="48" fill="url(#bgGradient)"/>
  
  <!-- Frontend Side (Left) - Browser Window -->
  <g transform="translate(20, 40)">
    <!-- Browser Frame -->
    <rect x="0" y="0" width="70" height="50" rx="6" fill="url(#frontendGradient)" opacity="0.9"/>
    <!-- Browser Header -->
    <rect x="0" y="0" width="70" height="12" rx="6" fill="#1e40af"/>
    <rect x="0" y="6" width="70" height="6" fill="#1e40af"/>
    <!-- Window Dots -->
    <circle cx="8" cy="6" r="2" fill="#f87171"/>
    <circle cx="15" cy="6" r="2" fill="#fbbf24"/>
    <circle cx="22" cy="6" r="2" fill="#34d399"/>
    <!-- Content Lines -->
    <rect x="8" y="20" width="54" height="4" rx="2" fill="white" opacity="0.7"/>
    <rect x="8" y="28" width="40" height="4" rx="2" fill="white" opacity="0.5"/>
    <rect x="8" y="36" width="48" height="4" rx="2" fill="white" opacity="0.5"/>
  </g>
  
  <!-- Backend Side (Right) - Server/Database -->
  <g transform="translate(102, 40)">
    <!-- Server Stack -->
    <rect x="0" y="0" width="70" height="50" rx="6" fill="url(#backendGradient)" opacity="0.9"/>
    <!-- Server Lines -->
    <line x1="8" y1="12" x2="62" y2="12" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="8" y1="25" x2="62" y2="25" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="8" y1="38" x2="62" y2="38" stroke="white" stroke-width="2" opacity="0.5"/>
    <!-- Server Lights -->
    <circle cx="55" cy="12" r="3" fill="#34d399"/>
    <circle cx="55" cy="25" r="3" fill="#34d399"/>
    <circle cx="55" cy="38" r="3" fill="#fbbf24"/>
  </g>
  
  <!-- Connection Layer - Code Brackets -->
  <g transform="translate(96, 96)">
    <!-- Left Bracket -->
    <path d="M-20 -15 L-30 0 L-20 15" stroke="#a855f7" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Bracket -->
    <path d="M20 -15 L30 0 L20 15" stroke="#a855f7" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Code Lines -->
    <line x1="-10" y1="-5" x2="10" y2="-5" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
    <line x1="-10" y1="5" x2="10" y2="5" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Bottom Layer - Database Icon -->
  <g transform="translate(96, 140)">
    <ellipse cx="0" cy="8" rx="25" ry="8" fill="#6366f1" opacity="0.8"/>
    <path d="M-25 8 L-25 24 C-25 28 25 28 25 24 L25 8" fill="#6366f1" opacity="0.6"/>
    <ellipse cx="0" cy="8" rx="25" ry="8" fill="none" stroke="#818cf8" stroke-width="2"/>
    <ellipse cx="0" cy="16" rx="25" ry="8" fill="none" stroke="#818cf8" stroke-width="2"/>
  </g>
</svg>
