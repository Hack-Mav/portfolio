<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="frontendGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="backendGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)"/>
  
  <!-- Frontend Side (Left) - Browser Window -->
  <g transform="translate(54, 107)">
    <!-- Browser Frame -->
    <rect x="0" y="0" width="186" height="133" rx="16" fill="url(#frontendGradient)" opacity="0.9"/>
    <!-- Browser Header -->
    <rect x="0" y="0" width="186" height="32" rx="16" fill="#1e40af"/>
    <rect x="0" y="16" width="186" height="16" fill="#1e40af"/>
    <!-- Window Dots -->
    <circle cx="21" cy="16" r="5" fill="#f87171"/>
    <circle cx="40" cy="16" r="5" fill="#fbbf24"/>
    <circle cx="59" cy="16" r="5" fill="#34d399"/>
    <!-- Content Lines -->
    <rect x="21" y="53" width="144" height="11" rx="5" fill="white" opacity="0.7"/>
    <rect x="21" y="75" width="107" height="11" rx="5" fill="white" opacity="0.5"/>
    <rect x="21" y="97" width="128" height="11" rx="5" fill="white" opacity="0.5"/>
  </g>
  
  <!-- Backend Side (Right) - Server/Database -->
  <g transform="translate(272, 107)">
    <!-- Server Stack -->
    <rect x="0" y="0" width="186" height="133" rx="16" fill="url(#backendGradient)" opacity="0.9"/>
    <!-- Server Lines -->
    <line x1="21" y1="32" x2="165" y2="32" stroke="white" stroke-width="5" opacity="0.5"/>
    <line x1="21" y1="67" x2="165" y2="67" stroke="white" stroke-width="5" opacity="0.5"/>
    <line x1="21" y1="101" x2="165" y2="101" stroke="white" stroke-width="5" opacity="0.5"/>
    <!-- Server Lights -->
    <circle cx="147" cy="32" r="8" fill="#34d399"/>
    <circle cx="147" cy="67" r="8" fill="#34d399"/>
    <circle cx="147" cy="101" r="8" fill="#fbbf24"/>
  </g>
  
  <!-- Connection Layer - Code Brackets -->
  <g transform="translate(256, 256)">
    <!-- Left Bracket -->
    <path d="M-53 -40 L-80 0 L-53 40" stroke="#a855f7" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Bracket -->
    <path d="M53 -40 L80 0 L53 40" stroke="#a855f7" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Code Lines -->
    <line x1="-27" y1="-13" x2="27" y2="-13" stroke="#a855f7" stroke-width="8" stroke-linecap="round"/>
    <line x1="-27" y1="13" x2="27" y2="13" stroke="#a855f7" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Bottom Layer - Database Icon -->
  <g transform="translate(256, 373)">
    <ellipse cx="0" cy="21" rx="67" ry="21" fill="#6366f1" opacity="0.8"/>
    <path d="M-67 21 L-67 64 C-67 75 67 75 67 64 L67 21" fill="#6366f1" opacity="0.6"/>
    <ellipse cx="0" cy="21" rx="67" ry="21" fill="none" stroke="#818cf8" stroke-width="5"/>
    <ellipse cx="0" cy="43" rx="67" ry="21" fill="none" stroke="#818cf8" stroke-width="5"/>
  </g>
</svg>
