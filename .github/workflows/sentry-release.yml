name: Sentry Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  release:
    name: Create Sentry Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create Sentry release
        uses: getsentry/action-release@v2
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || 'your-org-name' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'your-project-name' }}
        with:
          environment: production
          sourcemaps: 'dist/'
          sourcemaps_path: '~/'
          finalize: true
          deploy_started: true
          projects: ${{ vars.SENTRY_PROJECT || 'your-project-name' }}
          version: ${{ github.sha }}
